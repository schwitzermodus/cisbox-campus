name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Typecheck, Lint, Unit, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Playwright-Browser-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run e2e
